name: Docker Push Images

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches: [ "main", "release-*" ]

jobs:
  build-push-dockerhub:
    if: github.repository == 'vllm-project/aibrix'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      # One failed image should not cancel the others.
      fail-fast: false
      matrix:
        component:
          - name: controller-manager
            file: build/container/Dockerfile
          - name: gateway-plugins
            file: build/container/Dockerfile.gateway
          - name: metadata-service
            file: build/container/Dockerfile.python
          - name: runtime
            file: build/container/Dockerfile.python
          - name: kvcache-watcher
            file: build/container/Dockerfile.kvcache
          - name: vllm-mock
            file: development/app/Dockerfile
            context: development/app
          - name: kvcached-runtime
            file: build/container/Dockerfile.kvcached-runtime
            # Its kvcached-vLLM base image is built for amd64 only.
            platforms: linux/amd64
    steps:
      # The kvcached-runtime build needs about 31 GB of disk, more than the
      # 14 GB that GitHub documents for its hosted runners.
      - name: Free Disk Space
        if: matrix.component.name == 'kvcached-runtime'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.component.platforms || 'linux/amd64,linux/arm64' }}
          context: ${{ matrix.component.context || '.' }}
          file: ${{ matrix.component.file }}
          push: true
          tags: |
            aibrix/${{ matrix.component.name }}:${{ github.sha }}
            aibrix/${{ matrix.component.name }}:nightly

  build-push-ghcr:
    if: github.repository == 'vllm-project/aibrix'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      # One failed image should not cancel the others.
      fail-fast: false
      matrix:
        component:
          - name: controller-manager
            file: build/container/Dockerfile
          - name: gateway-plugins
            file: build/container/Dockerfile.gateway
          - name: metadata-service
            file: build/container/Dockerfile.python
          - name: runtime
            file: build/container/Dockerfile.python
          - name: kvcache-watcher
            file: build/container/Dockerfile.kvcache
          - name: vllm-mock
            file: development/app/Dockerfile
            context: development/app
          - name: kvcached-runtime
            file: build/container/Dockerfile.kvcached-runtime
            # Its kvcached-vLLM base image is built for amd64 only.
            platforms: linux/amd64
    steps:
      # The kvcached-runtime build needs about 31 GB of disk, more than the
      # 14 GB that GitHub documents for its hosted runners.
      - name: Free Disk Space
        if: matrix.component.name == 'kvcached-runtime'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Login to Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AIBRIX_ORG_PACKAGE_UPDATE_GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.component.platforms || 'linux/amd64,linux/arm64' }}
          context: ${{ matrix.component.context || '.' }}
          file: ${{ matrix.component.file }}
          push: true
          tags: |
            ghcr.io/aibrix/${{ matrix.component.name }}:${{ github.sha }}
            ghcr.io/aibrix/${{ matrix.component.name }}:nightly
