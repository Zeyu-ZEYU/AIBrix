# A ModelClaim attaches to a warm GPU pool: an ordinary Deployment of
# pre-warmed GPU-host pods labelled `pool.aibrix.ai/name: <pool>` and
# `pool.aibrix.ai/enabled: "true"`. The controller bin-packs this model onto a
# pod and serves it as its own engine process, sharing the pod's elastic KV
# cache (kvcached) with other ModelClaims.
apiVersion: model.aibrix.ai/v1alpha1
kind: ModelClaim
metadata:
  labels:
    app.kubernetes.io/name: aibrix
    app.kubernetes.io/managed-by: kustomize
  name: qwen2-7b-sample
spec:
  # Served model name clients address; defaults to metadata.name when omitted.
  modelName: qwen2-7b-instruct
  # Select the warm GPU pool to attach to.
  podSelector:
    matchLabels:
      pool.aibrix.ai/name: b300-pool-a
  artifactURL: huggingface://Qwen/Qwen2-7B-Instruct
  engine: vllm
  replicas: 1
  # What one instance of this model costs on a single GPU. The control plane
  # does not measure a model; these numbers come from the user. With tensor
  # parallelism they describe one device, not the whole model.
  perGPU:
    # Weights, captured CUDA graphs, activation workspaces and allocator
    # retention. Take it from a run of this model with these engine arguments.
    maximumFootprintBytes: 21474836480  # 20 GiB
    # The KV cache this instance needs to serve one request of max_model_len.
    # An engine's KV limit can be lowered towards this floor but never past it.
    kvFloorBytes: 4294967296  # 4 GiB
